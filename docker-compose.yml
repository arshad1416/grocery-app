# GroceryApp — Docker Compose
#
# Runs the zero-knowledge WebSocket relay server for Yjs CRDT sync.
# The relay server is ephemeral — Yjs documents live on the clients.
# Messages are end-to-end encrypted and the relay cannot read them.
#
# Phase 3: Identity-aware relay with configurable ports, rate limiting,
# family/device caps, and optional price-service container.
#
# Usage:
#   docker-compose up -d          # Start relay server
#   docker-compose logs -f        # Follow logs
#   docker-compose down           # Stop
#
# Override ports:
#   RELAY_PORT=9090 docker-compose up -d

services:
  relay:
    build:
      context: ./relay-server
      dockerfile: Dockerfile
    container_name: groceryapp-relay
    ports:
      - "${RELAY_PORT:-8080}:${RELAY_PORT:-8080}"
    environment:
      - PORT=${RELAY_PORT:-8080}
      - RELAY_PORT=${RELAY_PORT:-8080}
      - API_PORT=${API_PORT:-8080}
      - WS_PORT=${WS_PORT:-8080}
      - MAX_CLIENTS_PER_FAMILY=${MAX_CLIENTS_PER_FAMILY:-50}
      - MAX_FAMILIES=${MAX_FAMILIES:-100}
      - MAX_DEVICES_PER_FAMILY=${MAX_DEVICES_PER_FAMILY:-20}
      - RATE_LIMIT_MESSAGES=${RATE_LIMIT_MESSAGES:-100}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${RELAY_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional price-service container (disabled by default)
  # Uncomment to enable:
